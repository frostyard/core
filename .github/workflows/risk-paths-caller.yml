# PR triage caller (ADR-0068, ADR-0077, ADR-0078, docs/specs/pr-triage.md): runs
# core's reusable PR triage workflow on every pull request. It adds the level
# labels and risk:high, and removes ready-for-human when the head moved or CI is
# not green.
#
# In core the caller uses the local path. Under pull_request_target a local
# reusable workflow resolves to the base branch commit, not the pull request
# head, so it is pinned to trusted code. Other repositories pin
# frostyard/core/.github/workflows/pr-triage.yml@<40-char SHA> (ADR-0021).
# The job id must stay pr-triage: the readiness step leaves out check runs
# whose name starts with pr-triage. No merge_group trigger, and not a required
# check.
name: PR triage caller

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled]

permissions: {}

jobs:
  pr-triage:
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/pr-triage.yml
