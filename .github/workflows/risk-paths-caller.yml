# Risk paths caller (ADR-0068, docs/specs/risk-paths.md): runs core's reusable
# risk-paths workflow on every pull request to add the label risk:high.
#
# In core the caller uses the local path. Under pull_request_target a local
# reusable workflow resolves to the base branch commit, not the pull request
# head, so it is pinned to trusted code. Other repositories pin
# frostyard/core/.github/workflows/risk-paths.yml@<40-char SHA> (ADR-0021).
# No merge_group trigger, and not a required check.
name: Risk paths caller

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  risk-paths:
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/risk-paths.yml
