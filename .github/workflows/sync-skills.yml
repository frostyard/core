# Pushes core-managed agent skills to consuming repos as PRs (ADR-0026).
# Runs once a day at 05:23 UTC (before 07:00 America/New_York all year) and
# on manual dispatch for an urgent sync; no push trigger, so several skill
# changes on 1 day make 1 sync push in each consumer (ADR-0075).
name: Sync agent skills

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: sync-skills
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'frostyard/core'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sync skills to consuming repos
        env:
          GH_TOKEN: ${{ secrets.SKILLS_SYNC_TOKEN }}
        run: ./scripts/sync-skills.sh
