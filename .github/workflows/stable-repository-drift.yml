# Read-only stable repository alarm (ADR-0014, ADR-0048). This job verifies
# the frozen public baseline and never receives credentials or mutates storage.
name: Stable repository drift

on:
  schedule:
    # The complete retained pool is about 2.8 GiB, so run the full streamed
    # verification weekly rather than transferring it on every CI event.
    - cron: "23 5 * * 1"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: stable-repository-drift
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - run: npm run check:stable-repository
