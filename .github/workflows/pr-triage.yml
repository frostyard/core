# PR triage (ADR-0068, ADR-0077, ADR-0078, docs/specs/pr-triage.md): 3 steps
# from 1 job. `levels` adds the label level:L1 to level:L4 that the paths of a
# pull request set, and the label risk:high for L1 and L2, from the list in
# .github/risk-paths.json and the org floor (ADR-0068, ADR-0078). `readiness`
# removes the label ready-for-human when the pull request head moves after the
# label, or when the label comes while CI at the head is not green (ADR-0077).
# `shadow` writes 1 comment, "would auto-merge", on a Dependabot pull request
# that a narrow auto-merge class would take (docs/design/dependabot-shadow.md).
# It enables nothing: it never enables auto-merge, approves, merges or labels
# (ADR-0019 still holds).
#
# Reusable workflow. A caller runs it on pull_request_target, pinned to a
# 40-character frostyard/core commit SHA (ADR-0021). The job checks out
# nothing and runs no code from the pull request: it reads the list at
# github.event.pull_request.base.sha through the contents API, the changed
# files through the pulls API, the required checks of the base branch through
# the rulesets API, and the checks of the head through the checks API.
#
# GENERATED BLOCKS: the 2 heredocs below are scripts/lib/risk-paths.mjs
# verbatim, and scripts/lib/pr-triage.mjs verbatim plus 1 trailer line. Edit the
# libraries, then run `npm run sync:risk-paths-workflow`. `npm run
# check:risk-paths` fails when a copy drifts. Never edit an embedded copy by
# hand.
#
# Later steps use !cancelled() in their `if:`, so they run after an earlier
# step failed.
name: PR triage

on:
  workflow_call:
    inputs:
      dependabot-shadow:
        description: Run the Dependabot shadow step (docs/design/dependabot-shadow.md). It only writes a comment; it never enables auto-merge.
        type: boolean
        default: true

permissions: {}

jobs:
  pr-triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Write the triage scripts
        run: |
          mkdir -p "$RUNNER_TEMP/pr-triage"
          cat > "$RUNNER_TEMP/pr-triage/risk-paths.mjs" <<'RISK_PATHS_EOF'
          // Risk paths and levels (ADR-0068, ADR-0078, docs/specs/risk-paths.md): strict
          // parser, validator for list versions 1 and 2, glob matcher, the level of a
          // path and of a pull request, and a minimal GitHub API client. The labeling
          // step lives in scripts/lib/pr-triage.mjs.
          //
          // This module has no static imports. The reusable workflow
          // .github/workflows/pr-triage.yml embeds this file verbatim, writes it to a
          // file in the runner temp directory, and scripts/lib/pr-triage.mjs imports it
          // there, with no checkout. Edit this file, then run
          // `npm run sync:risk-paths-workflow`; `npm run check:risk-paths` fails when
          // the embedded copy drifts. Never edit the embedded copy by hand.
          //
          // Other repositories vendor this file and import validateRiskPaths,
          // matchGlob, parseStrictJson and matchFiles. Keep those names, their
          // signatures and their results for a version 1 list.

          export const LIST_PATH = ".github/risk-paths.json";
          export const LABEL = "risk:high";
          export const FILE_LIST_LIMIT = 3000;
          export const MAX_BRACE_EXPANSIONS = 256;
          export const MAX_WHY_LENGTH = 200;

          // Levels, strictest first: a lower number is stricter.
          export const LEVELS = Object.freeze(["L1", "L2", "L3", "L4"]);
          const LEVEL_LIST = LEVELS.join(", ");

          // The org floor: a path that matches the floor is at least this strict, whatever
          // a repository list says. A repository cannot change it.
          export const ORG_FLOORS = Object.freeze({
            L1: Object.freeze({
              words: Object.freeze([
                "secret", "secrets", "credential", "credentials", "password", "passwords", "passwd",
                "signing", "keyring", "keyrings", "keys", "gpg", "pgp",
              ]),
              extensions: Object.freeze(["pem", "key", "p12", "pfx", "gpg", "asc"]),
            }),
            L2: Object.freeze({
              globs: Object.freeze([
                ".github/workflows/**",
                ".github/actions/**",
                ".github/risk-paths.json",
                "policies/**",
                ".github/policies/**",
              ]),
            }),
          });
          const MAX_JSON_DEPTH = 64;
          const MAX_PAGES = 40;

          // ---- Strict JSON ----------------------------------------------------------

          // JSON.parse keeps the last of duplicate keys. This parser fails on a
          // duplicate key at any level and names the position of every error.
          export function parseStrictJson(text) {
            if (typeof text !== "string") throw new Error("JSON input is not a string");
            let pos = 0;

            const fail = (message) => {
              throw new Error(`invalid JSON at position ${pos}: ${message}`);
            };
            const skipWhitespace = () => {
              while (pos < text.length) {
                const c = text[pos];
                if (c === " " || c === "\t" || c === "\n" || c === "\r") pos++;
                else break;
              }
            };
            const expectLiteral = (word, value) => {
              if (text.startsWith(word, pos)) {
                pos += word.length;
                return value;
              }
              return fail("unexpected token");
            };

            const parseString = () => {
              // text[pos] is the opening quote.
              pos++;
              let out = "";
              while (true) {
                if (pos >= text.length) fail("unterminated string");
                const c = text[pos];
                const code = c.charCodeAt(0);
                if (c === '"') {
                  pos++;
                  return out;
                }
                if (code < 0x20) fail("control character in string");
                if (c !== "\\") {
                  out += c;
                  pos++;
                  continue;
                }
                const e = text[pos + 1];
                const simple = { '"': '"', "\\": "\\", "/": "/", b: "\b", f: "\f", n: "\n", r: "\r", t: "\t" };
                if (e !== undefined && Object.hasOwn(simple, e)) {
                  out += simple[e];
                  pos += 2;
                } else if (e === "u") {
                  const hex = text.slice(pos + 2, pos + 6);
                  if (!/^[0-9a-fA-F]{4}$/.test(hex)) fail("invalid unicode escape");
                  out += String.fromCharCode(parseInt(hex, 16));
                  pos += 6;
                } else {
                  fail("invalid escape");
                }
              }
            };

            const parseNumber = () => {
              const match = /^-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?(?:[eE][+-]?[0-9]+)?/.exec(text.slice(pos));
              if (!match) fail("invalid number");
              pos += match[0].length;
              return Number(match[0]);
            };

            const parseValue = (depth) => {
              if (depth > MAX_JSON_DEPTH) fail("nesting too deep");
              skipWhitespace();
              if (pos >= text.length) fail("unexpected end of input");
              const c = text[pos];
              if (c === "{") return parseObject(depth);
              if (c === "[") return parseArray(depth);
              if (c === '"') return parseString();
              if (c === "t") return expectLiteral("true", true);
              if (c === "f") return expectLiteral("false", false);
              if (c === "n") return expectLiteral("null", null);
              if (c === "-" || (c >= "0" && c <= "9")) return parseNumber();
              return fail("unexpected token");
            };

            const parseObject = (depth) => {
              pos++;
              const object = {};
              const seen = new Set();
              skipWhitespace();
              if (text[pos] === "}") {
                pos++;
                return object;
              }
              while (true) {
                skipWhitespace();
                if (text[pos] !== '"') fail("expected a string key");
                const keyPos = pos;
                const key = parseString();
                if (seen.has(key)) {
                  pos = keyPos;
                  fail(`duplicate key ${JSON.stringify(key)}`);
                }
                seen.add(key);
                skipWhitespace();
                if (text[pos] !== ":") fail("expected ':'");
                pos++;
                const value = parseValue(depth + 1);
                // defineProperty keeps a "__proto__" key an own, unknown key.
                Object.defineProperty(object, key, { value, enumerable: true, writable: true, configurable: true });
                skipWhitespace();
                if (text[pos] === ",") {
                  pos++;
                  continue;
                }
                if (text[pos] === "}") {
                  pos++;
                  return object;
                }
                fail("expected ',' or '}'");
              }
            };

            const parseArray = (depth) => {
              pos++;
              const array = [];
              skipWhitespace();
              if (text[pos] === "]") {
                pos++;
                return array;
              }
              while (true) {
                array.push(parseValue(depth + 1));
                skipWhitespace();
                if (text[pos] === ",") {
                  pos++;
                  continue;
                }
                if (text[pos] === "]") {
                  pos++;
                  return array;
                }
                fail("expected ',' or ']'");
              }
            };

            const value = parseValue(0);
            skipWhitespace();
            if (pos !== text.length) fail("unexpected data after the JSON value");
            return value;
          }

          // ---- Globs ----------------------------------------------------------------

          // Expands brace groups. Returns { expansions, errors }.
          function expandBraces(glob) {
            const errors = [];
            const parts = []; // each part is a list of alternatives
            let literal = "";
            let i = 0;
            while (i < glob.length) {
              const c = glob[i];
              if (c === "}") {
                errors.push("unmatched '}'");
                i++;
                continue;
              }
              if (c !== "{") {
                literal += c;
                i++;
                continue;
              }
              const close = glob.indexOf("}", i + 1);
              const nextOpen = glob.indexOf("{", i + 1);
              if (close === -1) {
                errors.push("unmatched '{'");
                break;
              }
              if (nextOpen !== -1 && nextOpen < close) {
                errors.push("nested braces are not supported");
                break;
              }
              const alternatives = glob.slice(i + 1, close).split(",");
              if (alternatives.length < 2) errors.push("a brace group needs at least 2 alternatives");
              if (alternatives.some((alternative) => alternative === "")) errors.push("a brace group has an empty alternative");
              parts.push([literal]);
              parts.push(alternatives);
              literal = "";
              i = close + 1;
            }
            if (errors.length > 0) return { expansions: [], errors };
            parts.push([literal]);
            let expansions = [""];
            for (const alternatives of parts) {
              const next = [];
              for (const prefix of expansions) {
                for (const alternative of alternatives) next.push(prefix + alternative);
              }
              if (next.length > MAX_BRACE_EXPANSIONS) {
                return { expansions: [], errors: [`brace expansion gives more than ${MAX_BRACE_EXPANSIONS} globs`] };
              }
              expansions = next;
            }
            return { expansions, errors: [] };
          }

          // Returns a list of error strings; an empty list means the glob is valid.
          export function validateGlob(glob) {
            if (typeof glob !== "string") return ["glob is not a string"];
            if (glob === "") return ["glob is empty"];
            const errors = [];
            for (const c of ["[", "]", "!", "\\"]) {
              if (glob.includes(c)) errors.push(`${JSON.stringify(c)} is not supported`);
            }
            const { expansions, errors: braceErrors } = expandBraces(glob);
            errors.push(...braceErrors);
            for (const expansion of expansions) {
              if (expansion.startsWith("/")) errors.push("a glob must not start with '/'");
              if (expansion.startsWith("./")) errors.push("a glob must not start with './'");
              for (const segment of expansion.split("/")) {
                if (segment === "") errors.push("a glob must not have an empty segment");
                else if (segment === "..") errors.push("a glob must not have a '..' segment");
                else if (segment.includes("**") && segment !== "**") errors.push("'**' must be a whole segment");
              }
            }
            return [...new Set(errors)];
          }

          function segmentPattern(segment) {
            let source = "^";
            for (const c of segment) {
              if (c === "*") source += "[^/]*";
              else if (c === "?") source += "[^/]";
              else source += c.replace(/[.*+?^$()|[\]{}\\/]/g, "\\$&");
            }
            return new RegExp(`${source}$`, "u");
          }

          function matchSegments(globSegments, pathSegments) {
            const patterns = globSegments.map((segment) => (segment === "**" ? null : segmentPattern(segment)));
            const memo = new Map();
            const visit = (g, p) => {
              const key = g * (pathSegments.length + 1) + p;
              if (memo.has(key)) return memo.get(key);
              let result;
              if (g === patterns.length) {
                result = p === pathSegments.length;
              } else if (patterns[g] === null) {
                // "**" matches 0 or more whole segments.
                result = visit(g + 1, p) || (p < pathSegments.length && visit(g, p + 1));
              } else {
                result = p < pathSegments.length && patterns[g].test(pathSegments[p]) && visit(g + 1, p + 1);
              }
              memo.set(key, result);
              return result;
            };
            return visit(0, 0);
          }

          // Whole-path, case-sensitive match of a valid glob against a repository path.
          export function matchGlob(glob, path) {
            if (typeof glob !== "string" || typeof path !== "string" || path === "") return false;
            const { expansions, errors } = expandBraces(glob);
            if (errors.length > 0) return false;
            const pathSegments = path.split("/");
            return expansions.some((expansion) => matchSegments(expansion.split("/"), pathSegments));
          }

          // ---- Validation -----------------------------------------------------------

          function isPlainObject(value) {
            if (value === null || typeof value !== "object" || Array.isArray(value)) return false;
            const proto = Object.getPrototypeOf(value);
            return proto === Object.prototype || proto === null;
          }

          function checkKeys(value, allowed, at, errors) {
            for (const key of Object.keys(value)) {
              if (!allowed.includes(key)) errors.push(`${at}: unknown key ${JSON.stringify(key)}`);
            }
            for (const key of allowed) {
              if (!Object.hasOwn(value, key)) errors.push(`${at}: missing key ${JSON.stringify(key)}`);
            }
          }

          const isLevel = (value) => typeof value === "string" && LEVELS.includes(value);

          // Validates a parsed list against the spec field table. Collects every error.
          // Version 1 has the keys schema_version and paths, and entries glob and why.
          // Version 2 adds default_level and a level in each entry.
          export function validateRiskPaths(value) {
            const errors = [];
            if (!isPlainObject(value)) {
              return { ok: false, errors: ["$: the top level must be an object"] };
            }
            const v2 = value.schema_version === 2;
            checkKeys(value, v2 ? ["schema_version", "default_level", "paths"] : ["schema_version", "paths"], "$", errors);
            if (value.schema_version !== 1 && value.schema_version !== 2) {
              errors.push("schema_version: must be the integer 1 or 2");
            }
            if (v2 && Object.hasOwn(value, "default_level") && !isLevel(value.default_level)) {
              errors.push(`default_level: must be 1 of ${LEVEL_LIST}`);
            }
            if (Object.hasOwn(value, "paths")) {
              if (!Array.isArray(value.paths)) {
                errors.push("paths: must be an array");
              } else {
                if (value.paths.length === 0) errors.push("paths: must have at least 1 entry");
                const globs = new Map();
                value.paths.forEach((entry, index) => {
                  const at = `paths[${index}]`;
                  if (!isPlainObject(entry)) {
                    errors.push(`${at}: must be an object`);
                    return;
                  }
                  checkKeys(entry, v2 ? ["glob", "level", "why"] : ["glob", "why"], at, errors);
                  if (Object.hasOwn(entry, "glob")) {
                    if (typeof entry.glob !== "string") {
                      errors.push(`${at}.glob: must be a string`);
                    } else {
                      for (const error of validateGlob(entry.glob)) {
                        errors.push(`${at}.glob: ${JSON.stringify(entry.glob)}: ${error}`);
                      }
                      if (globs.has(entry.glob)) {
                        errors.push(`${at}.glob: duplicate glob ${JSON.stringify(entry.glob)} (also paths[${globs.get(entry.glob)}])`);
                      } else {
                        globs.set(entry.glob, index);
                      }
                    }
                  }
                  if (v2 && Object.hasOwn(entry, "level") && !isLevel(entry.level)) {
                    errors.push(`${at}.level: must be 1 of ${LEVEL_LIST}`);
                  }
                  if (Object.hasOwn(entry, "why")) {
                    if (typeof entry.why !== "string") {
                      errors.push(`${at}.why: must be a string`);
                    } else if (entry.why.trim() === "") {
                      errors.push(`${at}.why: must not be empty`);
                    } else if ([...entry.why].length > MAX_WHY_LENGTH) {
                      errors.push(`${at}.why: must be at most ${MAX_WHY_LENGTH} characters`);
                    }
                  }
                });
              }
            }
            return { ok: errors.length === 0, errors };
          }

          // ---- Matching -------------------------------------------------------------

          // files: entries of the pulls/{n}/files shape { filename, status, previous_filename? }.
          // A rename matches by its new path and by its previous path.
          export function matchFiles(list, files) {
            const entries = Array.isArray(list) ? list : list.paths;
            const matches = [];
            const seen = new Set();
            for (const file of files) {
              const paths = [file.filename];
              if (typeof file.previous_filename === "string" && file.previous_filename !== file.filename) {
                paths.push(file.previous_filename);
              }
              for (const path of paths) {
                for (const entry of entries) {
                  if (!matchGlob(entry.glob, path)) continue;
                  const key = JSON.stringify([path, entry.glob]);
                  if (seen.has(key)) continue;
                  seen.add(key);
                  matches.push({ path, glob: entry.glob, why: entry.why });
                }
              }
            }
            return matches;
          }

          // ---- Levels ---------------------------------------------------------------

          const levelRank = (level) => LEVELS.indexOf(level);

          // The strictest of 2 levels; the first one wins a tie.
          const stricter = (a, b) => (levelRank(b) < levelRank(a) ? b : a);

          // The org floor of a path: { level, reason } or null.
          function floorOfPath(path) {
            const words = path.toLowerCase().split(/[/.\-_]/).filter((word) => word !== "");
            const word = words.find((candidate) => ORG_FLOORS.L1.words.includes(candidate));
            if (word !== undefined) return { level: "L1", reason: `org floor: path word ${JSON.stringify(word)}` };
            const last = path.split("/").pop();
            const dot = last.lastIndexOf(".");
            if (dot > 0) {
              const extension = last.slice(dot + 1).toLowerCase();
              if (ORG_FLOORS.L1.extensions.includes(extension)) {
                return { level: "L1", reason: `org floor: extension ${JSON.stringify(extension)}` };
              }
            }
            const glob = ORG_FLOORS.L2.globs.find((candidate) => matchGlob(candidate, path));
            if (glob !== undefined) return { level: "L2", reason: `org floor: ${glob}` };
            return null;
          }

          // A version 1 list reads as every glob at L1 and default_level L3.
          function levelEntries(list) {
            const v2 = list.schema_version === 2;
            return {
              defaultLevel: v2 ? list.default_level : "L3",
              entries: list.paths.map((entry) => ({ glob: entry.glob, level: v2 ? entry.level : "L1", why: entry.why })),
            };
          }

          // The level of 1 path under a valid list of version 1 or 2.
          // Returns { path, level, source, glob, why }; source is "glob", "default" or "floor".
          export function levelOfFile(list, path) {
            const { defaultLevel, entries } = levelEntries(list);
            let result = { path, level: defaultLevel, source: "default", glob: null, why: null };
            let best = null;
            for (const entry of entries) {
              if (!matchGlob(entry.glob, path)) continue;
              if (best === null || levelRank(entry.level) < levelRank(best.level)) best = entry;
            }
            if (best !== null) result = { path, level: best.level, source: "glob", glob: best.glob, why: best.why };
            const floor = floorOfPath(path);
            if (floor !== null && levelRank(floor.level) < levelRank(result.level)) {
              result = { path, level: floor.level, source: "floor", glob: null, why: floor.reason };
            }
            return result;
          }

          // The level of a pull request: the strictest level of its changed paths.
          // files: entries of the pulls/{n}/files shape, or plain path strings. A rename
          // counts by both names. A file list at the API limit is truncated: L1.
          export function levelOfPullRequest(list, files) {
            const paths = [];
            const seen = new Set();
            const add = (path) => {
              if (typeof path !== "string" || path === "" || seen.has(path)) return;
              seen.add(path);
              paths.push(path);
            };
            for (const file of files) {
              if (typeof file === "string") {
                add(file);
              } else {
                add(file?.filename);
                add(file?.previous_filename);
              }
            }
            const results = paths.map((path) => levelOfFile(list, path));
            const truncated = files.length >= FILE_LIST_LIMIT;
            let level = levelEntries(list).defaultLevel;
            if (results.length > 0) level = results.map((result) => result.level).reduce(stricter);
            if (truncated) level = "L1";
            return { level, truncated, files: results };
          }

          // Rule C for the gates: each required path must match a glob and, in a
          // version 2 list, no glob that matches it may be L3 or L4. Returns error strings.
          export function checkRequiredPaths(list, requiredPaths) {
            const errors = [];
            const v2 = list.schema_version === 2;
            for (const required of requiredPaths) {
              const matching = list.paths.filter((entry) => matchGlob(entry.glob, required));
              if (matching.length === 0) errors.push(`no glob matches the required path ${required}`);
              if (!v2) continue;
              for (const entry of matching) {
                if (entry.level === "L3" || entry.level === "L4") {
                  errors.push(`the glob ${entry.glob} matches the required path ${required} at level ${entry.level}; it must be L1 or L2`);
                }
              }
            }
            return errors;
          }

          // ---- GitHub API -----------------------------------------------------------

          export function createGitHubApi({ token, apiUrl = "https://api.github.com", fetch }) {
            if (!token) throw new Error("no GitHub token");
            if (typeof fetch !== "function") throw new Error("no fetch function");
            const base = String(apiUrl).replace(/\/+$/, "");
            const enc = encodeURIComponent;

            const request = async (method, path, { accept = "application/vnd.github+json", body, allow404 = false } = {}) => {
              const url = path.startsWith(`${base}/`) ? path : `${base}${path}`;
              const shownPath = url.slice(base.length).split("?")[0];
              const headers = {
                Accept: accept,
                Authorization: `Bearer ${token}`,
                "X-GitHub-Api-Version": "2022-11-28",
                "User-Agent": "frostyard-risk-paths",
              };
              if (body !== undefined) headers["Content-Type"] = "application/json";
              let response;
              try {
                response = await fetch(url, {
                  method,
                  headers,
                  body: body === undefined ? undefined : JSON.stringify(body),
                  redirect: "error",
                });
              } catch (error) {
                throw new Error(`GitHub API ${method} ${shownPath} failed: ${error?.message ?? "network error"}`);
              }
              if (allow404 && response.status === 404) return null;
              if (response.status < 200 || response.status > 299) {
                // The message stays as it was for existing callers; `status` lets a
                // caller tell one HTTP status from another without parsing the text.
                const error = new Error(`GitHub API ${method} ${shownPath} failed: HTTP ${response.status}`);
                error.status = response.status;
                throw error;
              }
              return response;
            };

            const nextLink = (header) => {
              if (!header) return null;
              for (const part of header.split(",")) {
                const match = /<([^>]+)>\s*;\s*rel="next"/.exec(part);
                if (match) return match[1];
              }
              return null;
            };

            // Reads every page of a list. The body is an array, or an object whose
            // `field` is the array.
            const paginate = async (first, { field, what }) => {
              const items = [];
              let next = first;
              for (let page = 0; next; page++) {
                if (page >= MAX_PAGES) throw new Error(`GitHub API ${what} has more than ${MAX_PAGES} pages`);
                // The token goes only to the configured API host.
                if (!next.startsWith("/") && !next.startsWith(`${base}/`)) {
                  throw new Error("GitHub API pagination link leaves the API host");
                }
                const response = await request("GET", next);
                const body = await response.json();
                const part = field === undefined ? body : body?.[field];
                if (!Array.isArray(part)) throw new Error(`GitHub API ${what} is not an array`);
                items.push(...part);
                next = nextLink(response.headers.get("link"));
              }
              return items;
            };

            return {
              async getFileAtRef(owner, repo, path, ref) {
                const encodedPath = path.split("/").map(enc).join("/");
                const response = await request(
                  "GET",
                  `/repos/${enc(owner)}/${enc(repo)}/contents/${encodedPath}?ref=${enc(ref)}`,
                  { accept: "application/vnd.github.raw+json", allow404: true },
                );
                return response === null ? null : await response.text();
              },

              // The pull request as it is now: a delayed or re-run job compares its head
              // with the head of its event.
              async getPullRequest(owner, repo, number) {
                const response = await request("GET", `/repos/${enc(owner)}/${enc(repo)}/pulls/${enc(String(number))}`);
                return await response.json();
              },

              async listPullFiles(owner, repo, number) {
                return paginate(`/repos/${enc(owner)}/${enc(repo)}/pulls/${enc(String(number))}/files?per_page=100`, {
                  what: "pull request file list",
                });
              },

              async listIssueComments(owner, repo, number) {
                return paginate(`/repos/${enc(owner)}/${enc(repo)}/issues/${enc(String(number))}/comments?per_page=100`, {
                  what: "issue comment list",
                });
              },

              async listIssueLabels(owner, repo, number) {
                return paginate(`/repos/${enc(owner)}/${enc(repo)}/issues/${enc(String(number))}/labels?per_page=100`, {
                  what: "issue label list",
                });
              },

              // The comment GitHub created, so that a caller can compare its id with another
              // run's comment for the same head.
              async createIssueComment(owner, repo, number, body) {
                const response = await request("POST", `/repos/${enc(owner)}/${enc(repo)}/issues/${enc(String(number))}/comments`, {
                  body: { body },
                });
                return await response.json();
              },

              // Returns true when the comment went away, false when it was already gone (HTTP 404).
              async deleteIssueComment(owner, repo, commentId) {
                const response = await request(
                  "DELETE",
                  `/repos/${enc(owner)}/${enc(repo)}/issues/comments/${enc(String(commentId))}`,
                  { allow404: true },
                );
                return response !== null;
              },

              // Returns true when the label came off, false when the issue did not have it (HTTP 404).
              async removeIssueLabel(owner, repo, number, name) {
                const response = await request(
                  "DELETE",
                  `/repos/${enc(owner)}/${enc(repo)}/issues/${enc(String(number))}/labels/${enc(name)}`,
                  { allow404: true },
                );
                return response !== null;
              },

              // The latest run of each check name (filter=latest), as GitHub's checks
              // rollup counts them: an older failed run that a re-run replaced does not
              // count.
              async listCheckRuns(owner, repo, sha) {
                return paginate(`/repos/${enc(owner)}/${enc(repo)}/commits/${enc(sha)}/check-runs?filter=latest&per_page=100`, {
                  field: "check_runs",
                  what: "check run list",
                });
              },

              // The statuses array, not the combined state: the combined state is
              // "pending" when a commit has no statuses.
              async listCommitStatuses(owner, repo, sha) {
                return paginate(`/repos/${enc(owner)}/${enc(repo)}/commits/${enc(sha)}/status?per_page=100`, {
                  field: "statuses",
                  what: "commit status list",
                });
              },

              // The rules that apply to a branch (the rulesets API), all pages. The branch
              // is encoded part by part, as a path is.
              async listBranchRules(owner, repo, branch) {
                const encodedBranch = String(branch).split("/").map(enc).join("/");
                return paginate(`/repos/${enc(owner)}/${enc(repo)}/rules/branches/${encodedBranch}?per_page=100`, {
                  what: "branch rule list",
                });
              },

              async labelExists(owner, repo, name) {
                const response = await request("GET", `/repos/${enc(owner)}/${enc(repo)}/labels/${enc(name)}`, { allow404: true });
                return response !== null;
              },

              async addLabels(owner, repo, number, labels) {
                await request("POST", `/repos/${enc(owner)}/${enc(repo)}/issues/${enc(String(number))}/labels`, {
                  body: { labels },
                });
              },
            };
          }

          // ---- Helpers --------------------------------------------------------------

          export function escapeCell(value) {
            return String(value)
              .replace(/[\\`*_[\]|]/g, "\\$&")
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/\r\n|\r|\n|\u2028|\u2029/g, " ");
          }

          export const NAME_PATTERN = /^[A-Za-z0-9_.-]+$/;

          // Escapes a workflow-command value (the runner reads %, CR and LF specially).
          export function commandValue(text) {
            return String(text).replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A");
          }
          RISK_PATHS_EOF
          cat > "$RUNNER_TEMP/pr-triage/pr-triage.mjs" <<'PR_TRIAGE_EOF'
          // PR triage (ADR-0077, ADR-0078, docs/specs/pr-triage.md): the levels step that
          // adds the level label level:L1 to level:L4 and, for L1 and L2, the label
          // risk:high (ADR-0068, docs/specs/risk-paths.md), the readiness step that
          // removes the label ready-for-human when the pull request head moves after the
          // label, or when the label comes while CI at the head is not green, and the
          // shadow step that writes 1 comment "would auto-merge" on a Dependabot pull
          // request that a narrow auto-merge class would take, and enables nothing
          // (docs/design/dependabot-shadow.md). `main` picks the step from
          // PR_TRIAGE_STEP: `levels`, `readiness` or `shadow`.
          //
          // The reusable workflow .github/workflows/pr-triage.yml embeds this file
          // verbatim, plus 1 trailer line, and scripts/lib/risk-paths.mjs beside it. It
          // writes both to the runner temp directory and runs this file with Node, with
          // no checkout. Edit this file, then run `npm run sync:risk-paths-workflow`;
          // `npm run check:risk-paths` fails when the embedded copy drifts. Never edit
          // the embedded copy by hand.
          import {
            FILE_LIST_LIMIT,
            LABEL,
            LEVELS,
            LIST_PATH,
            NAME_PATTERN,
            commandValue,
            createGitHubApi,
            escapeCell,
            levelOfPullRequest,
            parseStrictJson,
            validateRiskPaths,
          } from "./risk-paths.mjs";

          export const READY_LABEL = "ready-for-human";
          export const MARKER_PREFIX = "<!-- frostyard:readiness-revoked v1";
          const OWN_CHECK_PREFIX = "pr-triage";
          const GREEN_CONCLUSIONS = new Set(["success", "neutral", "skipped"]);
          const BAD_STATUS_STATES = new Set(["pending", "failure", "error"]);
          const SUMMARY_ROW_LIMIT = 50;
          const LEVELS_ROW_LIMIT = 500;
          const READINESS_PREFIX = "pr-triage: readiness: ";
          const LEVELS_PREFIX = "risk-paths: ";
          export const LEVEL_LABELS = Object.freeze({ L1: "level:L1", L2: "level:L2", L3: "level:L3", L4: "level:L4" });
          const SHA_PATTERN = /^[0-9a-f]{40}$/;

          // ---- Dependabot shadow ----------------------------------------------------

          export const DEPENDABOT_LOGIN = "dependabot[bot]";
          export const SHADOW_MARKER_PREFIX = "<!-- frostyard:dependabot-shadow v1";
          export const SHADOW_ACTIONS = ["opened", "synchronize", "reopened"];
          // The author of every comment that github.token writes.
          export const SHADOW_AUTHOR = "github-actions[bot]";
          const SHADOW_PREFIX = "pr-triage: shadow: ";
          const MANIFEST_NAMES = [
            "go.mod",
            "go.sum",
            "package.json",
            "package-lock.json",
            "npm-shrinkwrap.json",
            "pnpm-lock.yaml",
            "yarn.lock",
            "Cargo.toml",
            "Cargo.lock",
            "pyproject.toml",
            "poetry.lock",
            "uv.lock",
            "Pipfile",
            "Pipfile.lock",
            "Gemfile",
            "Gemfile.lock",
          ];
          export const MANIFEST_FILES = new Set(MANIFEST_NAMES);
          const REQUIREMENTS_PATTERN = /^requirements.*[.]txt$/;
          const MINOR_UPDATE_TYPES = new Set(["version-update:semver-patch", "version-update:semver-minor"]);

          // The head SHA is read in 1 place only: the readiness step and the shadow step
          // both use this helper.
          const headShaOf = (pr) => pr?.head?.sha;

          // ---- Comments -------------------------------------------------------------

          const short = (sha) => sha.slice(0, 12);

          // The marker line of a revocation comment; it is also the comment's first line.
          export function readinessMarker({ reason, before, after, head }) {
            if (reason === "head-moved") return `${MARKER_PREFIX} reason=head-moved before=${before} after=${after} -->`;
            if (reason === "checks-not-green") return `${MARKER_PREFIX} reason=checks-not-green head=${head} -->`;
            throw new Error(`unknown readiness reason ${JSON.stringify(reason)}`);
          }

          export function readinessComment({ reason, before, after, head }) {
            const marker = readinessMarker({ reason, before, after, head });
            if (reason === "head-moved") {
              return (
                `${marker}\n` +
                `\`${READY_LABEL}\` came off: the head moved from \`${short(before)}\` to \`${short(after)}\` after the label. ` +
                "Run the checks and the review again at the new head, then add the label again."
              );
            }
            return (
              `${marker}\n` +
              `\`${READY_LABEL}\` came off: CI at \`${short(head)}\` was not green when the label came. ` +
              "Add the label again when every check passes at this head."
            );
          }

          // ---- Checks ---------------------------------------------------------------

          // Returns { relevant, notGreen } for the check runs and commit statuses of a
          // head. The check runs of this workflow (names that start with pr-triage) are
          // left out: the step cannot wait for itself.
          export function evaluateChecks(checkRuns, statuses) {
            const runs = checkRuns.filter((run) => !String(run?.name ?? "").startsWith(OWN_CHECK_PREFIX));
            const notGreen = [];
            for (const run of runs) {
              if (run?.status !== "completed") {
                notGreen.push({ kind: "check run", name: run?.name, state: String(run?.status) });
              } else if (!GREEN_CONCLUSIONS.has(run.conclusion)) {
                notGreen.push({ kind: "check run", name: run.name, state: String(run.conclusion) });
              }
            }
            for (const status of statuses) {
              if (BAD_STATUS_STATES.has(status?.state)) {
                notGreen.push({ kind: "status", name: status.context, state: String(status.state) });
              }
            }
            return { relevant: runs.length + statuses.length, notGreen };
          }

          // ---- Step -----------------------------------------------------------------

          // Reads 1 list of checks at the head. HTTP 403 gives null: the token cannot
          // read checks (a private repository, where the job's `contents: read` and
          // `pull-requests: write` do not cover check runs and commit statuses). Any
          // other error throws.
          async function readChecksOrNull(read) {
            try {
              return await read();
            } catch (error) {
              if (error?.status === 403) return null;
              throw error;
            }
          }

          export async function runReadinessStep({ api, eventName, event, summary, log, notice }) {
            const say = (message, value) =>
              log(value === undefined ? `${READINESS_PREFIX}${message}` : `${READINESS_PREFIX}${message} ${JSON.stringify(value)}`);

            if (eventName !== "pull_request_target") {
              throw new Error(`the caller must run on pull_request_target, not ${JSON.stringify(eventName)}`);
            }
            const pr = event?.pull_request;
            const owner = event?.repository?.owner?.login;
            const repo = event?.repository?.name;
            const number = pr?.number;
            if (typeof owner !== "string" || !NAME_PATTERN.test(owner) || typeof repo !== "string" || !NAME_PATTERN.test(repo)) {
              throw new Error("the event has no valid repository owner and name");
            }
            if (!Number.isSafeInteger(number) || number < 1) throw new Error("the event has no valid pull request number");
            const action = event?.action;
            say("repository", `${owner}/${repo}`);
            say("pull request", number);
            say("action", action);

            const done = async (outcome, text) => {
              say(text);
              await summary(`## Readiness\n\n${text}\n`);
              return { outcome };
            };

            let revocation;
            let notGreen = [];
            if (action === "synchronize") {
              const labels = Array.isArray(pr?.labels) ? pr.labels : [];
              if (!labels.some((label) => label?.name === READY_LABEL)) {
                return done("no-label", `the pull request has no \`${READY_LABEL}\` label. No label change.`);
              }
              const { before, after } = event;
              if (typeof before !== "string" || !SHA_PATTERN.test(before)) {
                throw new Error("the event has no valid before (40 hex characters)");
              }
              if (typeof after !== "string" || !SHA_PATTERN.test(after)) {
                throw new Error("the event has no valid after (40 hex characters)");
              }
              revocation = { reason: "head-moved", before, after };
              say("head moved", { before, after });
            } else if (action === "labeled" && event?.label?.name === READY_LABEL) {
              const head = headShaOf(pr);
              if (typeof head !== "string" || !SHA_PATTERN.test(head)) {
                throw new Error("the event has no valid pull request head SHA (40 hex characters)");
              }
              say("head", head);
              const checkRuns = await readChecksOrNull(() => api.listCheckRuns(owner, repo, head));
              const statuses = checkRuns === null ? null : await readChecksOrNull(() => api.listCommitStatuses(owner, repo, head));
              if (checkRuns === null || statuses === null) {
                const what = checkRuns === null ? "the check runs" : "the commit statuses";
                const text =
                  `readiness unknown: the token cannot read ${what} at the head (HTTP 403). ` +
                  "No label change and no comment. A push after the label still removes it.";
                if (typeof notice === "function") notice(`pr-triage readiness: ${text}`);
                return done("unknown", text);
              }
              const evaluated = evaluateChecks(checkRuns, statuses);
              say("checks counted", evaluated.relevant);
              if (evaluated.relevant === 0) {
                return done("no-checks", "no check run and no commit status at the head. No label change.");
              }
              if (evaluated.notGreen.length === 0) {
                return done("green", "every check at the head is green. The label stays.");
              }
              notGreen = evaluated.notGreen;
              revocation = { reason: "checks-not-green", head };
              for (const row of notGreen) say("not green", row);
            } else {
              return done("ignored", "the event is not a push to a labeled pull request and not the label being added. No label change.");
            }

            // The marker comment comes first: when the delete fails, a re-run finds the
            // marker and writes no second comment.
            const marker = readinessMarker(revocation);
            const comments = await api.listIssueComments(owner, repo, number);
            const hasMarker = comments.some(
              (comment) => typeof comment?.body === "string" && comment.body.split(/\r?\n/).some((line) => line.trim() === marker),
            );
            if (!hasMarker) {
              await api.createIssueComment(owner, repo, number, readinessComment(revocation));
              say("wrote the marker comment", revocation.reason);
            } else {
              say("the marker comment exists", revocation.reason);
            }
            const removed = await api.removeIssueLabel(owner, repo, number, READY_LABEL);
            say(removed ? "removed label" : "label already gone", READY_LABEL);

            const lines = [
              "## Readiness",
              "",
              `Removed the label \`${READY_LABEL}\`${removed ? "" : " (it was already gone)"}. Reason: \`${revocation.reason}\`.`,
              "",
            ];
            if (notGreen.length > 0) {
              lines.push("| Check | Kind | State |", "| --- | --- | --- |");
              for (const row of notGreen.slice(0, SUMMARY_ROW_LIMIT)) {
                lines.push(`| ${escapeCell(row.name)} | ${row.kind} | ${escapeCell(row.state)} |`);
              }
              if (notGreen.length > SUMMARY_ROW_LIMIT) {
                lines.push("", `${notGreen.length - SUMMARY_ROW_LIMIT} more checks are not shown here; the job log lists every one.`);
              }
            }
            await summary(`${lines.join("\n")}\n`);
            return { outcome: "revoked", reason: revocation.reason, commented: !hasMarker, removed };
          }

          // ---- Levels step ----------------------------------------------------------

          const levelRank = (level) => LEVELS.indexOf(level);

          // Adds the level label of the pull request and, for L1 and L2, risk:high. A
          // level label only gets stricter: a looser computed level keeps the stricter
          // label that the pull request has. Never removes risk:high. Never creates a
          // label: the add-labels API creates a missing one, so the step checks first.
          export async function runLevelsStep({ api, eventName, event, summary, log }) {
            const say = (message, value) =>
              log(value === undefined ? `${LEVELS_PREFIX}${message}` : `${LEVELS_PREFIX}${message} ${JSON.stringify(value)}`);

            if (eventName !== "pull_request_target") {
              throw new Error(`the caller must run on pull_request_target, not ${JSON.stringify(eventName)}`);
            }
            const pr = event?.pull_request;
            const owner = event?.repository?.owner?.login;
            const repo = event?.repository?.name;
            const number = pr?.number;
            const baseSha = pr?.base?.sha;
            if (typeof owner !== "string" || !NAME_PATTERN.test(owner) || typeof repo !== "string" || !NAME_PATTERN.test(repo)) {
              throw new Error("the event has no valid repository owner and name");
            }
            if (!Number.isSafeInteger(number) || number < 1) throw new Error("the event has no valid pull request number");
            if (typeof baseSha !== "string" || !SHA_PATTERN.test(baseSha)) {
              throw new Error("the event has no valid pull_request.base.sha (40 hex characters)");
            }
            const fullName = `${owner}/${repo}`;
            say("repository", fullName);
            say("pull request", number);
            say("base sha", baseSha);

            const text = await api.getFileAtRef(owner, repo, LIST_PATH, baseSha);
            if (text === null) {
              say(`no list on base: ${LIST_PATH} does not exist at`, baseSha);
              await summary(`## Levels\n\nno list on base: \`${LIST_PATH}\` does not exist at \`${baseSha}\`. No label change.\n`);
              return { outcome: "no-list" };
            }

            let list;
            try {
              list = parseStrictJson(text);
            } catch (error) {
              throw new Error(`${LIST_PATH} at ${baseSha} is not valid: ${error.message}`);
            }
            const validation = validateRiskPaths(list);
            if (!validation.ok) {
              throw new Error(`${LIST_PATH} at ${baseSha} is not valid: ${validation.errors.join("; ")}`);
            }
            say("list entries", list.paths.length);

            if (!(await api.labelExists(owner, repo, LABEL))) {
              throw new Error(
                `label ${LABEL} does not exist in ${fullName}; the accountable owner must create it ` +
                  `(gh label create ${LABEL} --repo ${fullName} --color B60205 --description "Touches a high-risk path (ADR-0068)")`,
              );
            }
            const missingLabels = [];
            for (const level of LEVELS) {
              if (!(await api.labelExists(owner, repo, LEVEL_LABELS[level]))) missingLabels.push(LEVEL_LABELS[level]);
            }

            const files = await api.listPullFiles(owner, repo, number);
            say("changed files", files.length);
            const computed = levelOfPullRequest(list, files);
            const level = computed.level;
            say("computed level", level);
            const strict = computed.files.filter((result) => result.level === "L1" || result.level === "L2");
            for (const result of strict) say("path", result);

            const alias = level === "L1" || level === "L2" ? [LABEL] : [];
            const added = [];
            const removed = [];
            let outcome;
            let kept = null;
            if (missingLabels.length > 0) {
              outcome = "labels-missing";
              if (alias.length > 0) {
                await api.addLabels(owner, repo, number, alias);
                added.push(...alias);
              }
            } else {
              const current = (await api.listIssueLabels(owner, repo, number)).map((label) => label?.name);
              const currentLevels = LEVELS.filter((candidate) => current.includes(LEVEL_LABELS[candidate]));
              const strictest = currentLevels[0];
              const raise = strictest === undefined || levelRank(level) < levelRank(strictest);
              const toAdd = raise ? [LEVEL_LABELS[level], ...alias] : alias;
              if (!raise) kept = strictest;
              if (toAdd.length > 0) {
                await api.addLabels(owner, repo, number, toAdd);
                added.push(...toAdd);
              }
              if (raise) {
                for (const candidate of currentLevels) {
                  if (levelRank(candidate) <= levelRank(level)) continue;
                  await api.removeIssueLabel(owner, repo, number, LEVEL_LABELS[candidate]);
                  removed.push(LEVEL_LABELS[candidate]);
                }
              }
              outcome = raise ? "labeled" : "kept";
            }
            for (const name of added) say("added label", name);
            for (const name of removed) say("removed label", name);

            const lines = ["## Levels", ""];
            if (kept !== null) {
              lines.push(`Level: computed ${level}, kept ${kept}. A level label only gets stricter.`);
            } else {
              lines.push(`Level: computed ${level}.`);
            }
            if (added.length > 0) lines.push("", `Added ${added.map((name) => `\`${name}\``).join(", ")}.`);
            if (removed.length > 0) lines.push("", `Removed ${removed.map((name) => `\`${name}\``).join(", ")}.`);
            if (missingLabels.length > 0) {
              const warning =
                `warning: the label ${missingLabels.join(", ")} does not exist in ${fullName}; no level label changed. ` +
                `Fix: frostyard/core scripts/apply-triage-settings.sh ${fullName} --apply`;
              say(warning);
              lines.push("", `**${escapeCell(warning)}**`);
            }
            if (computed.truncated) {
              say("file list truncated at", files.length);
              lines.push(
                "",
                `The file list is truncated: the GitHub API returned ${files.length} files, its limit is 3000. The level is L1 (fail safe).`,
              );
            }
            if (strict.length > 0) {
              lines.push("", "| Path | Glob or floor | Level | Why |", "| --- | --- | --- | --- |");
              for (const result of strict.slice(0, LEVELS_ROW_LIMIT)) {
                const where = result.source === "glob" ? result.glob : result.source === "floor" ? "org floor" : "default_level";
                lines.push(`| ${escapeCell(result.path)} | ${escapeCell(where)} | ${result.level} | ${escapeCell(result.why ?? "")} |`);
              }
              if (strict.length > LEVELS_ROW_LIMIT) {
                lines.push("", `${strict.length - LEVELS_ROW_LIMIT} more paths are not shown here; the job log lists every path.`);
              }
            }
            await summary(`${lines.join("\n")}\n`);
            return { outcome, level, truncated: computed.truncated, added, removed, missingLabels };
          }

          // ---- Shadow checks -------------------------------------------------------

          // A version: an optional leading "v", then 2 or more dot-separated decimal
          // numbers, and nothing else. Returns an array of BigInt, or null. BigInt keeps
          // every digit: Number would make 2 versions different only above 2^53 equal.
          export function parseVersion(text) {
            if (typeof text !== "string") return null;
            const match = /^v?([0-9]+(?:[.][0-9]+)+)$/.exec(text);
            if (match === null) return null;
            return match[1].split(".").map((part) => BigInt(part));
          }

          // S1: patch or minor only. `updatesText` is the updated-dependencies-json output
          // of dependabot/fetch-metadata. A grouped pull request passes when every entry
          // passes. A change of the first number is a major update, and so is a change of
          // the second number while the first is 0.
          export function checkS1(updatesText) {
            const fail = (detail) => ({ pass: false, detail });
            if (typeof updatesText !== "string" || updatesText.trim() === "") return fail("no update metadata");
            let updates;
            try {
              updates = JSON.parse(updatesText);
            } catch {
              return fail("the update metadata is not JSON");
            }
            if (!Array.isArray(updates)) return fail("the update metadata is not an array");
            if (updates.length === 0) return fail("the update metadata has no entry");
            for (let index = 0; index < updates.length; index++) {
              const update = updates[index];
              if (update === null || typeof update !== "object" || Array.isArray(update)) {
                return fail(`entry ${index + 1} is not an object`);
              }
              const named = typeof update.dependencyName === "string" && update.dependencyName !== "";
              const name = named ? update.dependencyName : `entry ${index + 1}`;
              if (!MINOR_UPDATE_TYPES.has(update.updateType)) {
                return fail(`${name}: the update type is ${JSON.stringify(update.updateType)}, not patch or minor`);
              }
              const before = parseVersion(update.prevVersion);
              if (before === null) return fail(`${name}: prevVersion ${JSON.stringify(update.prevVersion)} is not a version`);
              const after = parseVersion(update.newVersion);
              if (after === null) return fail(`${name}: newVersion ${JSON.stringify(update.newVersion)} is not a version`);
              if (before[0] !== after[0]) return fail(`${name}: ${update.prevVersion} to ${update.newVersion} is a major update`);
              if (before[0] === 0n && before[1] !== after[1]) {
                return fail(`${name}: ${update.prevVersion} to ${update.newVersion} is a major update of a 0.x version`);
              }
            }
            return { pass: true, detail: `${updates.length} ${updates.length === 1 ? "update" : "updates"}, patch or minor` };
          }

          const baseName = (filePath) => String(filePath).split("/").pop();

          // S2: manifest and lock files only, and a file list that is not truncated.
          export function checkS2(files) {
            if (!Array.isArray(files) || files.length === 0) return { pass: false, detail: "no changed file" };
            if (files.length >= FILE_LIST_LIMIT) {
              return { pass: false, detail: `the file list is truncated at ${files.length} files` };
            }
            for (const entry of files) {
              const filename = entry?.filename;
              if (typeof filename !== "string" || filename === "") return { pass: false, detail: "a changed file has no path" };
              const previous = entry?.previous_filename;
              const paths = typeof previous === "string" && previous !== "" ? [filename, previous] : [filename];
              for (const filePath of paths) {
                const name = baseName(filePath);
                if (MANIFEST_FILES.has(name) || REQUIREMENTS_PATTERN.test(name)) continue;
                return { pass: false, detail: `${filePath} is not a manifest or lock file` };
              }
            }
            return { pass: true, detail: `${files.length} ${files.length === 1 ? "file" : "files"}, manifest and lock files only` };
          }

          // S3: no risk path. The computed level of the changed paths must be L3 or L4.
          // It reads the list only, never the labels of the pull request. Any error fails
          // this criterion, and the step itself does not fail.
          export function checkS3(listText, files) {
            try {
              if (typeof listText !== "string") return { pass: false, detail: "no list at the base SHA", level: null };
              const list = parseStrictJson(listText);
              const validation = validateRiskPaths(list);
              if (!validation.ok) {
                return { pass: false, detail: `the list is not valid: ${validation.errors.join("; ")}`, level: null };
              }
              const computed = levelOfPullRequest(list, files);
              const level = computed.level;
              if (level !== "L3" && level !== "L4") return { pass: false, detail: `the computed level is ${level}`, level };
              return { pass: true, detail: `the computed level is ${level}`, level };
            } catch (error) {
              return { pass: false, detail: `the level failed: ${error?.message ?? "unknown error"}`, level: null };
            }
          }

          // S4: the base branch requires at least 1 status check, so that the merge queue
          // or the branch protection waits for CI before the merge.
          export function checkS4(rules) {
            const checks = [];
            const seen = new Set();
            const list = Array.isArray(rules) ? rules : [];
            for (const rule of list) {
              if (rule?.type !== "required_status_checks") continue;
              const required = rule?.parameters?.required_status_checks;
              if (!Array.isArray(required)) continue;
              for (const entry of required) {
                const context = String(entry?.context ?? "");
                const integrationId = typeof entry?.integration_id === "number" ? entry.integration_id : null;
                const key = JSON.stringify([context, integrationId]);
                if (seen.has(key)) continue;
                seen.add(key);
                checks.push({ context, integration_id: integrationId });
              }
            }
            if (checks.length === 0) return { pass: false, detail: "the base branch requires no status check", checks };
            return { pass: true, detail: `${checks.length} required ${checks.length === 1 ? "check" : "checks"}`, checks };
          }

          // The marker line. It is the first line of the comment, and 1 comment per head
          // holds it. The JSON escapes <, > and & so that a check name cannot end the HTML
          // comment, and the text stays valid JSON.
          export function shadowMarker({ head, level, checks }) {
            const json = JSON.stringify(checks.map(({ context, integration_id }) => ({ context, integration_id })))
              .replace(/</g, "\\u003c")
              .replace(/>/g, "\\u003e")
              .replace(/&/g, "\\u0026");
            return `${SHADOW_MARKER_PREFIX} head=${head} level=${level} checks=${json} -->`;
          }

          export function shadowComment({ head, level, checks }) {
            const marker = shadowMarker({ head, level, checks });
            return (
              `${marker}\n` +
              `Shadow call: auto-merge would be enabled at \`${short(head)}\` ` +
              `(patch or minor; manifest and lock files only; level ${level}; ${checks.length} required checks). ` +
              "Nothing is enabled. A person still merges."
            );
          }

          // A call comment of this head: a comment that github.token wrote, with a marker
          // line for the head. A comment by another author never counts, and it is never
          // deleted.
          const isCallComment = (comment, markerPrefix) =>
            comment?.user?.login === SHADOW_AUTHOR &&
            Number.isSafeInteger(comment?.id) &&
            comment.id > 0 &&
            typeof comment?.body === "string" &&
            comment.body.split(/\r?\n/).some((line) => line.trim().startsWith(markerPrefix));

          // Each head keeps 1 call: the call comment with the lowest id. Every other call
          // comment of this head is deleted, whoever wrote it, so a run after a failed
          // cleanup repairs the duplicates. Returns { kept, deleted }; kept is null when
          // there is no call comment.
          async function keepLowestCall(api, owner, repo, number, comments, markerPrefix) {
            const calls = comments.filter((comment) => isCallComment(comment, markerPrefix)).sort((a, b) => a.id - b.id);
            const [lowest, ...duplicates] = calls;
            const deleted = [];
            for (const comment of duplicates) {
              await api.deleteIssueComment(owner, repo, comment.id);
              deleted.push(comment.id);
            }
            return { kept: lowest === undefined ? null : lowest.id, deleted };
          }

          // The summary line of a run whose event head is not the live head.
          const staleLine = (eventHead, liveHead) =>
            typeof liveHead === "string" && SHA_PATTERN.test(liveHead)
              ? `The head moved from \`${short(eventHead)}\` to \`${short(liveHead)}\`. No comment.`
              : `The head moved from \`${short(eventHead)}\` to a head that is unknown. No comment.`;

          // ---- Shadow step ----------------------------------------------------------

          // Reads, and writes at most 1 comment. It never enables auto-merge, approves,
          // merges or labels, and it reads no label.
          export async function runShadowStep({ api, eventName, event, updates, summary, log }) {
            const say = (message, value) =>
              log(value === undefined ? `${SHADOW_PREFIX}${message}` : `${SHADOW_PREFIX}${message} ${JSON.stringify(value)}`);

            if (eventName !== "pull_request_target") {
              throw new Error(`the caller must run on pull_request_target, not ${JSON.stringify(eventName)}`);
            }
            const pr = event?.pull_request;
            const owner = event?.repository?.owner?.login;
            const repo = event?.repository?.name;
            const number = pr?.number;
            if (typeof owner !== "string" || !NAME_PATTERN.test(owner) || typeof repo !== "string" || !NAME_PATTERN.test(repo)) {
              throw new Error("the event has no valid repository owner and name");
            }
            if (!Number.isSafeInteger(number) || number < 1) throw new Error("the event has no valid pull request number");
            const action = event?.action;
            say("repository", `${owner}/${repo}`);
            say("pull request", number);
            say("action", action);

            const done = async (outcome, text) => {
              say(text);
              await summary(`## Dependabot shadow\n\n${text}\n`);
              return { outcome };
            };

            if (pr?.user?.login !== DEPENDABOT_LOGIN) {
              return done("ignored", `the pull request author is not \`${DEPENDABOT_LOGIN}\`. No comment.`);
            }
            if (!SHADOW_ACTIONS.includes(action)) {
              return done("ignored", `the action is not ${SHADOW_ACTIONS.join(", ")}. No comment.`);
            }
            if (pr?.draft === true) return done("ignored", "the pull request is a draft. No comment.");

            const head = headShaOf(pr);
            if (typeof head !== "string" || !SHA_PATTERN.test(head)) {
              throw new Error("the event has no valid pull request head SHA (40 hex characters)");
            }
            const baseSha = pr?.base?.sha;
            if (typeof baseSha !== "string" || !SHA_PATTERN.test(baseSha)) {
              throw new Error("the event has no valid pull_request.base.sha (40 hex characters)");
            }
            const baseRef = pr?.base?.ref;
            if (typeof baseRef !== "string" || baseRef === "") throw new Error("the event has no pull_request.base.ref");
            say("head", head);
            say("base", { sha: baseSha, ref: baseRef });

            // A delayed or re-run job must not judge the files of a newer head.
            const first = await api.getPullRequest(owner, repo, number);
            const firstHead = headShaOf(first);
            if (firstHead !== head) {
              say("the live head is not the event head", { event: head, live: firstHead });
              const line = staleLine(head, firstHead);
              await summary(`## Dependabot shadow\n\n${line}\n`);
              return { outcome: "stale" };
            }

            const s1 = checkS1(updates);
            say("S1 patch or minor", s1);
            const files = await api.listPullFiles(owner, repo, number);
            say("changed files", files.length);
            const s2 = checkS2(files);
            say("S2 manifest and lock files", s2);
            let s3;
            try {
              const listText = await api.getFileAtRef(owner, repo, LIST_PATH, baseSha);
              s3 = checkS3(listText, files);
            } catch (error) {
              s3 = { pass: false, detail: `reading the list failed: ${error?.message ?? "unknown error"}`, level: null };
            }
            say("S3 no risk path", { pass: s3.pass, detail: s3.detail, level: s3.level });
            const rules = await api.listBranchRules(owner, repo, baseRef);
            const s4 = checkS4(rules);
            say("S4 required checks", s4);

            const level = typeof s3.level === "string" ? s3.level : null;
            const checks = Array.isArray(s4.checks) ? s4.checks : [];
            const results = [
              { id: "S1 patch or minor", detail: s1.detail, pass: s1.pass },
              { id: "S2 manifest and lock files", detail: s2.detail, pass: s2.pass },
              { id: "S3 no risk path", detail: s3.detail, pass: s3.pass },
              { id: "S4 required checks", detail: s4.detail, pass: s4.pass },
            ];
            const lines = ["## Dependabot shadow", "", "| Criterion | Result | Detail |", "| --- | --- | --- |"];
            for (const result of results) {
              lines.push(`| ${result.id} | ${result.pass ? "pass" : "fail"} | ${escapeCell(result.detail)} |`);
            }
            const failed = results.filter((result) => !result.pass).map((result) => result.id.split(" ")[0]);
            if (failed.length > 0) {
              say("no call: failed", failed);
              lines.push("", `No call: ${failed.join(", ")} did not pass. No comment was written.`);
              await summary(`${lines.join("\n")}\n`);
              return { outcome: "no-call", level, checks, failed };
            }

            // The files and the metadata were read live, so the head can move again while
            // the criteria run: read it once more, and write nothing for an older head.
            const second = await api.getPullRequest(owner, repo, number);
            const secondHead = headShaOf(second);
            if (secondHead !== head) {
              say("the live head moved during the evaluation", { event: head, live: secondHead });
              lines.push("", staleLine(head, secondHead));
              await summary(`${lines.join("\n")}\n`);
              return { outcome: "stale", level, checks };
            }

            const markerPrefix = `${SHADOW_MARKER_PREFIX} head=${head} `;
            const comments = await api.listIssueComments(owner, repo, number);
            const existing = comments.filter((comment) => isCallComment(comment, markerPrefix));
            if (existing.length > 0) {
              // The cleanup also runs here: a run whose own cleanup failed leaves 2 call
              // comments, and the next run for this head removes the higher one.
              const cleanup = await keepLowestCall(api, owner, repo, number, comments, markerPrefix);
              say("a call for this head exists", { head, kept: cleanup.kept, deleted: cleanup.deleted });
              lines.push("", `A shadow call for this head exists: comment ${cleanup.kept}. No second comment.`);
              if (cleanup.deleted.length === 1) lines.push("", "Removed 1 duplicate call comment.");
              else if (cleanup.deleted.length > 1) lines.push("", `Removed ${cleanup.deleted.length} duplicate call comments.`);
              await summary(`${lines.join("\n")}\n`);
              return cleanup.deleted.length > 0
                ? { outcome: "exists", level, checks, deduplicated: true }
                : { outcome: "exists", level, checks };
            }
            const written = await api.createIssueComment(owner, repo, number, shadowComment({ head, level, checks }));
            const ownId = written?.id;
            if (!Number.isSafeInteger(ownId) || ownId < 1) throw new Error("the comment API returned no comment id");
            const comment = shadowComment({ head, level, checks });
            say("wrote the shadow call", { head, id: ownId });

            // The write follows a read, so another run can have written between them. The
            // own comment is a call comment too, even when the new list lags behind it.
            const after = await api.listIssueComments(owner, repo, number);
            const owned = { id: ownId, user: { login: SHADOW_AUTHOR }, body: comment };
            const candidates = [owned, ...after.filter((entry) => entry?.id !== ownId)];
            const cleanup = await keepLowestCall(api, owner, repo, number, candidates, markerPrefix);
            if (cleanup.kept !== ownId) {
              say("removed this run's duplicate comment", { own: ownId, kept: cleanup.kept });
              lines.push(
                "",
                "Another run wrote a comment for this head first. This run removed its own comment. Nothing is enabled. A person still merges.",
              );
              await summary(`${lines.join("\n")}\n`);
              return { outcome: "exists", level, checks, deduplicated: true };
            }
            if (cleanup.deleted.length > 0) say("removed a later duplicate comment", cleanup.deleted);
            lines.push("", "Wrote the shadow call. Nothing is enabled. A person still merges.");
            await summary(`${lines.join("\n")}\n`);
            return { outcome: "called", level, checks };
          }

          // ---- Entry ----------------------------------------------------------------

          export async function main(env) {
            const token = env.GITHUB_TOKEN;
            try {
              const step = env.PR_TRIAGE_STEP;
              if (step !== "levels" && step !== "readiness" && step !== "shadow") {
                throw new Error(`unknown PR_TRIAGE_STEP ${JSON.stringify(step)}`);
              }
              const fs = await import("node:fs/promises");
              if (!env.GITHUB_EVENT_PATH) throw new Error("GITHUB_EVENT_PATH is not set");
              if (!token) throw new Error("GITHUB_TOKEN is not set");
              const event = JSON.parse(await fs.readFile(env.GITHUB_EVENT_PATH, "utf8"));
              const api = createGitHubApi({
                token,
                apiUrl: env.GITHUB_API_URL || "https://api.github.com",
                fetch: globalThis.fetch,
              });
              const summary = async (markdown) => {
                if (env.GITHUB_STEP_SUMMARY) await fs.appendFile(env.GITHUB_STEP_SUMMARY, markdown);
              };
              // Untrusted text never starts a line: a line without the prefix is quoted.
              const prefix = step === "levels" ? LEVELS_PREFIX : step === "readiness" ? READINESS_PREFIX : SHADOW_PREFIX;
              const log = (line) => {
                const text = String(line).replace(/[\r\n\u2028\u2029]/g, " ");
                process.stdout.write(`${text.startsWith(prefix) ? text : prefix + JSON.stringify(text)}\n`);
              };
              const run = step === "levels" ? runLevelsStep : step === "readiness" ? runReadinessStep : runShadowStep;
              // A workflow annotation: the run page shows it without the log open.
              const notice = (text) => {
                process.stdout.write(`::notice::${commandValue(text)}\n`);
              };
              const options = { api, eventName: env.GITHUB_EVENT_NAME, event, summary, log, notice };
              if (step === "shadow") options.updates = env.DEPENDABOT_UPDATES;
              return await run(options);
            } catch (error) {
              let message = String(error?.message ?? error);
              if (token) message = message.split(token).join("***");
              message = message.replace(/[\r\n\u2028\u2029]+/g, " ");
              process.stdout.write(`::error::${commandValue(message)}\n`);
              process.exitCode = 1;
              return undefined;
            }
          }
          await main(process.env);
          PR_TRIAGE_EOF
      - name: Add level labels and risk:high
        id: levels
        if: ${{ github.event.action != 'labeled' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_TRIAGE_STEP: levels
        run: node "$RUNNER_TEMP/pr-triage/pr-triage.mjs"
      - name: Remove ready-for-human when the head moved or CI is not green
        id: readiness
        if: ${{ !cancelled() && (github.event.action == 'synchronize' || (github.event.action == 'labeled' && github.event.label.name == 'ready-for-human')) }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_TRIAGE_STEP: readiness
        run: node "$RUNNER_TEMP/pr-triage/pr-triage.mjs"
      - name: Fetch the Dependabot metadata
        id: deps
        if: ${{ !cancelled() && inputs.dependabot-shadow && github.event.pull_request.user.login == 'dependabot[bot]' && contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action) }}
        continue-on-error: true
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2.5.0
        with:
          github-token: ${{ github.token }}
      - name: Write the Dependabot shadow call
        id: shadow
        if: ${{ !cancelled() && inputs.dependabot-shadow && github.event.pull_request.user.login == 'dependabot[bot]' && contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action) }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_TRIAGE_STEP: shadow
          DEPENDABOT_UPDATES: ${{ steps.deps.outputs.updated-dependencies-json }}
        run: node "$RUNNER_TEMP/pr-triage/pr-triage.mjs"
