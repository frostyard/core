# Core CI (ADR-0021: SHA-pinned, least-privilege): organization authority and
# docs integrity at the repository root, plus the docs-site scaffold build in
# ProperDocs + MaterialX.
name: CI

on:
  push:
    branches: [main]
  pull_request: {}
  # Merge queue (ADR-0042): the required checks must also run on the queue's
  # temporary branches, or every queue entry waits out the check timeout.
  merge_group: {}
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - run: npm ci
      - run: make ci

  fleet-conventions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - run: npm run check:fleet

  scaffold-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .agents/skills/frostyard-docs-site/scaffold/requirements.txt
      - name: Build the scaffold site and assert on its output
        run: node --test .agents/skills/frostyard-docs-site/tests/*.test.mjs
