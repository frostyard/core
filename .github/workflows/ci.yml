# Core CI (ADR-0021: SHA-pinned, least-privilege): organization authority and
# docs integrity at the repository root, plus the docs-site scaffold e2e suite.
name: CI

on:
  push:
    branches: [main]
  pull_request: {}
  # Merge queue (ADR-0042): the required checks must also run on the queue's
  # temporary branches, or every queue entry waits out the check timeout.
  merge_group: {}
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - run: npm ci
      - run: make ci

  fleet-conventions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - run: npm run check:fleet

  scaffold-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .agents/skills/frostyard-docs-site/scaffold
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: .agents/skills/frostyard-docs-site/scaffold/package-lock.json
      - run: npm ci
      - run: npm test # astro build + pagefind + node --test tests/*.test.mjs
