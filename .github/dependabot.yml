# Dependabot (ADR-0071 row B13): 1 entry for each ecosystem with a manifest in
# this repository. Each entry has 1 group with `patterns: ["*"]`, so each entry
# opens at most 1 version-update PR for each run (ADR-0075). The group has no
# `applies-to`, so security updates stay 1 PR each.
#
# The hash-locked .agents/skills/frostyard-docs-site/scaffold/requirements.txt
# is refreshed by the repository-hygiene line with `uv pip compile`, not by
# Dependabot. Skill payloads are not scanned.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      npm:
        patterns: ["*"]
